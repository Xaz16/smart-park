<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Smart Parking</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!-- шапка -->
    <header class="header">
        <div class="logo">
            <a href="#" data-route="/" style="color: white; text-decoration: none;">Умная парковка от УраганDev</a>
        </div>
        <div class="auth-icon" id="authIcon">
            🔑
        </div>
    </header>

    <!-- main -->
    <main class="main-content">
        <section class="parking-details">
            <p>Адрес: <span id="parkingAddress">—</span></p>
            <p>ID: <span id="parkingId">—</span></p>
            <p>Статус: <span id="parkingStatus">—</span></p>
            <p>Координаты: <span id="parkingCoords">—</span></p>
            <p>Создана: <span id="parkingCreated">—</span></p>
        </section>
        <section class="video-section">
            <h2 class="video-title">Парковка №1</h2>
            
            
            <!-- статистика парковки и легенда -->
            <div class="parking-info">
                <div class="parking-stats">
                    <div>Всего мест: <span id="totalSpaces">—</span></div>
                    <div><span style="color: #219a52;"> Свободно: <span id="freeSpaces">—</span></span></div>
                    <div><span style="color: #e74c3c;"> Занято: <span id="occupiedSpaces">—</span></span></div>
                    <div style="font-size: 0.85em; color: #666; margin-top: 5px;">
                        <span id="lastUpdateInfo"></span>
                    </div>
                </div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="color-box free"></div>
                        <span style="color:#219a52;">Свободно</span>
                    </div>
                    <div class="legend-item">
                        <div class="color-box occupied"></div>
                        <span style="color: #e74c3c;">Занято</span>
                    </div>
                </div>
            </div>
            
            <div class="video-container">
                <div class="video-placeholder">
                    <img id="parkingImage" src="" alt="видеотрансляция">
                </div>
            </div>
            <!-- кнопка менюшки -->
            <div class="video-controls">
                
                <button class="sidebar-toggle" onclick="window.app.toggleSidebar()">
                    ☰ Меню
                </button>
            </div>
        </section>

        
    </main>

    <!-- сайдбар -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Список парковок</h2>
            <button class="sidebar-close" onclick="window.app.toggleSidebar()">×</button>
        </div>
        <div class="sidebar-content">
            <h3>Доступные парковки</h3>
            <ul class="parking-list" id="parkingList"></ul>
        </div>
    </div>

    
    <div class="overlay" id="overlay"></div>

    <!-- окно авторизации -->
    <div class="auth-modal" id="authModal">
        <div class="auth-modal-header">
            <h2>Авторизация</h2>
            <button class="auth-modal-close" onclick="window.app.closeAuthModal()">×</button>
        </div>
        <form class="auth-form" id="authForm">
            <input type="text" id="authUsername" placeholder="Логин" required>
            <div class="password-input-wrapper">
                <input type="password" id="authPassword" placeholder="Пароль" required>
                <button type="button" class="password-toggle" id="passwordToggle" onclick="window.app.togglePasswordVisibility()">👁️</button>
            </div>
            <div id="authError" class="auth-error" style="display: none; color: #e74c3c; margin-bottom: 1rem; padding: 0.5rem; background: #fee; border-radius: 5px;"></div>
            <button type="submit">Войти</button>
        </form>
    </div>

    <div class="loader-overlay" id="loader">
        <div class="loader"></div>
    </div>

    <!-- PhotoSwipe container -->
    <div class="pswp" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="pswp__bg"></div>
        <div class="pswp__scroll-wrap">
            <div class="pswp__container">
                <div class="pswp__item"></div>
                <div class="pswp__item"></div>
                <div class="pswp__item"></div>
            </div>
            <div class="pswp__ui pswp__ui--hidden">
                <div class="pswp__top-bar">
                    <div class="pswp__counter"></div>
                    <button class="pswp__button pswp__button--close" title="Close (Esc)"></button>
                    <button class="pswp__button pswp__button--share" title="Share"></button>
                    <button class="pswp__button pswp__button--fs" title="Toggle fullscreen"></button>
                    <button class="pswp__button pswp__button--zoom" title="Zoom in/out"></button>
                    <div class="pswp__preloader">
                        <div class="pswp__preloader__icn">
                            <div class="pswp__preloader__cut">
                                <div class="pswp__preloader__donut"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pswp__share-modal pswp__share-modal--hidden pswp__single-tap">
                    <div class="pswp__share-tooltip"></div>
                </div>
                <button class="pswp__button pswp__button--arrow--left" title="Previous (arrow left)"></button>
                <button class="pswp__button pswp__button--arrow--right" title="Next (arrow right)"></button>
                <div class="pswp__caption">
                    <div class="pswp__caption__center"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Подключаем скрипты в правильном порядке -->
    <!-- constants.js должен загружаться БЕЗ defer, чтобы быть доступным сразу -->
    <script type="module" src="constants.js"></script>
    <script type="module" defer src="services/toast.js"></script>
    <script type="module" defer src="services/confirm.js"></script>
    <script type="module" defer src="router.js"></script>
    <script type="module" defer src="services/auth.js"></script>
    <script type="module" defer src="views/home.js"></script>
    <script type="module" defer src="views/parking.js"></script>
    <script type="module" defer src="views/admin.js"></script>
    <script type="module" defer src="views/service-admin.js"></script>
    <script type="module" defer src="views/service-admin-parkings.js"></script>
    <script type="module" defer src="views/service-admin-users.js"></script>
    <script type="module" defer src="views/service-admin-cameras.js"></script>
    <script type="module" defer src="views/parking-admin.js"></script>
    <script type="module" defer src="views/parking-admin-parking.js"></script>
    <script type="module" defer src="main.js"></script>
</body>
</html>
