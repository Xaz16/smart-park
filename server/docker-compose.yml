version: "3.9"

services:
  db:
    image: postgres:15
    container_name: smart-park-postgres
    environment:
      POSTGRES_DB: smart_parking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./tmp/postgres_data:/var/lib/postgresql/data
      - ./db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nn-service:
    build:
      context: ../nn
    container_name: smart-park-nn-service
    environment:
      MODEL_PATH: /app/parking_classifier.pt
      SLOTS_PATH: /app/slots.json
      PORT: 5000
    restart: unless-stopped

  server:
    image: node:lts
    container_name: smart-park-server
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: smart_parking
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 3000
      NODE_ENV: production
      NN_SERVICE_URL: http://nn-service:5000
      NN_SERVICE_TIMEOUT: 30000
    volumes:
      - ./:/app
    working_dir: /app
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      nn-service:
        condition: service_started
    restart: unless-stopped

